name: learn_english_ios_app
description: Offline-first English vocabulary learning app for iPhone.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  cross_file: ^0.3.5+2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  google_mlkit_text_recognition: ^0.17.1
  pdfx: ^2.11.0
  flutter_tts: ^4.2.5
  csv: ^8.0.0
  share_plus: ^13.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/
