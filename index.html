<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <!-- Android WebView: viewport chuẩn, không scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Android PWA meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-navbutton-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-title" content="Learn English" />

    <title>Learn English - Học Tiếng Anh Thông Minh</title>
    <meta name="description" content="Ứng dụng học tiếng Anh thông minh: Kho từ vựng, Flashcard, Trắc nghiệm, Luyện viết, Luyện nghe và OCR nhận diện từ." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <style>
      /* Prevent iOS/Android bounce scroll & tap highlight */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      html, body { overscroll-behavior: none; }

      /* Safe area insets for notch / punch-hole screens */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Splash screen trong khi load */
      #splash {
        position: fixed; inset: 0;
        background: #0f172a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash svg { animation: pulse 1.5s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <!-- Splash screen nội tuyến khi app khởi động -->
    <div id="splash">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="96" height="96" rx="24" fill="url(#grad)"/>
        <text x="48" y="62" font-size="44" text-anchor="middle" fill="white" font-family="serif" font-weight="bold">E</text>
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366f1"/>
            <stop offset="1" stop-color="#0ea5e9"/>
          </linearGradient>
        </defs>
      </svg>
      <p style="color:#94a3b8;font-size:14px;margin-top:20px;font-family:sans-serif;letter-spacing:0.05em;">LEARN ENGLISH</p>
    </div>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Ẩn splash screen sau khi React render xong
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(() => splash.remove(), 600);
          }
        }, 800);
      });
    </script>
  </body>
</html>
