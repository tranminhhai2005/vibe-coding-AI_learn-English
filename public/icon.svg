<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Book icon background -->
  <rect x="80" y="120" width="352" height="272" rx="24" fill="url(#bookGrad)" opacity="0.15"/>

  <!-- Letter E stylized -->
  <text x="256" y="320" font-size="260" text-anchor="middle" fill="white" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" opacity="0.95">E</text>

  <!-- Stars / sparks top-right -->
  <circle cx="390" cy="110" r="14" fill="white" opacity="0.9"/>
  <circle cx="420" cy="150" r="8" fill="white" opacity="0.7"/>
  <circle cx="360" cy="80" r="6" fill="white" opacity="0.6"/>

  <!-- Bottom wave decoration -->
  <path d="M 60 440 Q 150 400 256 440 Q 362 480 450 440 L 450 510 L 60 510 Z" fill="white" opacity="0.06"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="352" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
